<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>결제 확인 - Roomescape</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet" />
</head>
<body>
<main class="page">
  <header class="hero">
    <p class="eyebrow">ROOMESCAPE</p>
    <h1 id="resultTitle">결제 확인 중</h1>
    <p id="resultDescription">카드 인증이 끝났습니다. 결제 승인과 예약 확정을 처리하고 있어요.</p>
  </header>

  <section class="panel">
    <h2>처리 결과</h2>

    <div class="loading-box" id="loadingState" role="status" aria-busy="true">
      <span class="spinner" aria-hidden="true"></span>
      <span>확인 중입니다...</span>
    </div>

    <div class="success-box" id="successState" hidden role="status">
      <span class="reservation-text" id="successDetail"></span>
    </div>

    <div class="failure-box" id="failureState" hidden role="alert">
      <span class="reservation-text" id="failureDetail"></span>
    </div>

    <div class="unclear-box" id="unclearState" hidden role="alert">
      <span class="reservation-text" id="unclearDetail"></span>
      <button id="retryConfirm" type="button">다시 확인하기</button>
    </div>
  </section>

  <p><a class="admin-link" href="/reservations.html">내 예약 확인하러 가기</a></p>
</main>
<script src="/common.js"></script>
<script src="/payment-success.js"></script>
</body>
</html>
